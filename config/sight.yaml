# =============================================================================
# ELEVATION AND LINE OF SIGHT (positions pass P5)
# On a battle's terrain (config/terrain.yaml): fire needs a clear line from the firer's eye to the target, and fire
# from higher ground tells more. Without terrain (an open field) neither applies.
# - Line of sight: a straight line from eye_height above the firer's ground to eye_height above the target's,
#   checked every sample_step yards. It is blocked where the ground (plus forest_height in woods) rises above it.
#   The first and last edge_clear yards are not checked, so a unit at a wood's edge sees out and can be seen; deeper
#   in, the trees in between hide it. Blocks fire (artillery included), not closing fire on a charge or melee.
#   (Later: mortars and other high-angle artillery will ignore it.)
# - Elevation: fire (and closing fire) is multiplied by 1 + clamp(height difference / elevation_scale,
#   −elevation_max, +elevation_max): firing from 15 yards higher, +15%.
# First guesses, untuned.
# =============================================================================
sight:

  # Yards above the ground a unit sees from (and stands as a target), by type: men on foot, riders.
  eye_height: {inf: 2.0, cav: 3.0, art: 2.0}

  forest_height: 12.0
  sample_step: 10.0
  edge_clear: 30.0

  elevation_scale: 100.0
  elevation_max: 0.15
