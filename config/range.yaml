# =============================================================================
# RANGE (positions pass P1)
# Fire falls off with distance: full effect up to a weapon's close range, then down to nothing at its maximum
# range. Distances in yards, centre to centre on the flat. Units without a position aren't affected (as before).
#   reach = 1                                  distance <= close
#         = (1 − t)^falloff_exponent           t = (distance − close) / (max − close)
#         = 0                                  distance >= max
# Closing fire on a charge is close by definition and isn't reduced. First guesses from drill-book and
# ordnance-manual ranges, untuned.
# =============================================================================
range:

  # 1 = a straight line from full effect to nothing; > 1 falls faster past close range.
  falloff_exponent: 1.0

  # Small arms, by weapon code (the third stat): -2 unarmed / pikes (pistols, thrown), -1 matchlock,
  # 0 smoothbore musket, 1 rifled musket, 2 needle rifle.
  small_arms:
    '-2': {close: 10, max: 40}
    '-1': {close: 50, max: 150}
    '0':  {close: 80, max: 250}
    '1':  {close: 150, max: 500}
    '2':  {close: 200, max: 600}

  # Artillery, by the ammo ordered.
  artillery:
    round_shot: {close: 500, max: 1600}
    shell: {close: 500, max: 1500}
    canister: {close: 100, max: 400}
