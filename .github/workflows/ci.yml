name: CI

# Runs where it matters: on main (a pass there deploys the site) and on pull requests into main. Work branches are
# checked locally before every push by .githooks/pre-push (the same commands). Can also be run by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # the typecheck, then the tests with 100% coverage (the pre-push hook runs the same)
      - run: npm run check
